name: Fetch Threat Intel Feeds

on:
  schedule:
    # Off the :00/:30 marks, where GitHub delays and drops scheduled runs.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

concurrency:
  group: fetch-feeds
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch ThreatFox
        env:
          THREATFOX_AUTH_KEY: ${{ secrets.THREATFOX_AUTH_KEY }}
        run: python scripts/fetch_threatfox.py
        continue-on-error: true

      - name: Fetch URLhaus
        env:
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
        run: python scripts/fetch_urlhaus.py
        continue-on-error: true

      - name: Fetch MalwareBazaar
        env:
          MALWAREBAZAAR_AUTH_KEY: ${{ secrets.MALWAREBAZAAR_AUTH_KEY }}
        run: python scripts/fetch_malwarebazaar.py
        continue-on-error: true

      - name: Fetch CISA KEV
        run: python scripts/fetch_kev.py
        continue-on-error: true

      - name: Fetch OTX
        env:
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
        run: python scripts/fetch_otx.py
        continue-on-error: true

      - name: Fetch Blocklist.de
        run: python scripts/fetch_blocklistde.py
        continue-on-error: true

      # Its own file, not part of latest.json. One request per run keeps
      # well inside ransomware.live's 1 request/minute limit.
      - name: Fetch ransomware.live recent victims
        run: python scripts/fetch_ransomware_live.py
        continue-on-error: true

      # UK cyber security headlines from public RSS feeds, last 48h.
      # Its own file, not part of latest.json.
      - name: Fetch UK cyber news
        run: python scripts/fetch_uk_news.py
        continue-on-error: true

      - name: Build snapshot
        run: python scripts/build_snapshot.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/ransomware_victims.json data/uk_news.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update threat feed snapshot [skip ci]"
            # The two workflows push to main independently, so the remote may
            # have moved since checkout. They write disjoint files, so a
            # rebase is always clean; retry in case of a second race.
            for attempt in 1 2 3; do
              git pull --rebase --quiet && git push && exit 0
              echo "Push attempt $attempt failed; retrying."
              sleep $((attempt * 10))
            done
            exit 1
          fi
