name: Fetch Threat Intel Feeds

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: fetch-feeds
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch ThreatFox
        env:
          THREATFOX_AUTH_KEY: ${{ secrets.THREATFOX_AUTH_KEY }}
        run: python scripts/fetch_threatfox.py
        continue-on-error: true

      - name: Fetch URLhaus
        env:
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
        run: python scripts/fetch_urlhaus.py
        continue-on-error: true

      - name: Fetch MalwareBazaar
        env:
          MALWAREBAZAAR_AUTH_KEY: ${{ secrets.MALWAREBAZAAR_AUTH_KEY }}
        run: python scripts/fetch_malwarebazaar.py
        continue-on-error: true

      - name: Fetch CISA KEV
        run: python scripts/fetch_kev.py
        continue-on-error: true

      - name: Fetch OTX
        env:
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
        run: python scripts/fetch_otx.py
        continue-on-error: true

      - name: Fetch Blocklist.de
        run: python scripts/fetch_blocklistde.py
        continue-on-error: true

      - name: Build snapshot
        run: python scripts/build_snapshot.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update threat feed snapshot [skip ci]"
            git push
          fi
