name: Daily Intel

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: fetch-enrichment
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run GreyNoise enrichment
        env:
          GREYNOISE_API_KEY: ${{ secrets.GREYNOISE_API_KEY }}
        run: python scripts/fetch_greynoise_enrichment.py
        continue-on-error: true

      - name: Fetch IP geolocation / ASN data
        run: python scripts/fetch_geo.py
        continue-on-error: true

      - name: Fetch EPSS scores
        run: python scripts/fetch_epss.py
        continue-on-error: true

      - name: Fetch Shodan InternetDB data
        run: python scripts/fetch_internetdb.py
        continue-on-error: true

      - name: Fetch AbuseIPDB reports
        env:
          ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
        run: python scripts/fetch_abuseipdb.py
        continue-on-error: true

      - name: Fetch Spamhaus DROP
        run: python scripts/fetch_spamhaus_drop.py
        continue-on-error: true

      - name: Fetch ransomware.live recent victims
        run: python scripts/fetch_ransomware_live.py
        continue-on-error: true

      - name: Append today's trend counts
        run: python scripts/append_trend.py
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/enrichment.json data/geo.json data/geo_summary.json data/trends.json \
                  data/epss.json data/internetdb.json data/abuseipdb.json \
                  data/spamhaus_drop.json data/ransomware_victims.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update daily intel data [skip ci]"
            git push
          fi
